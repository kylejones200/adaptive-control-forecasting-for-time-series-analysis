data:
  generate_synthetic: true
  n_periods: 120
  seed: 42
  regime_change_at: 60
  stable_noise: 0.5
  volatile_noise: 2.5

adaptive_smoothing:
  alpha_init: 0.2
  gamma: 0.1
  alpha_min: 0.05
  alpha_max: 0.95

holt_winters:
  season_length: 12
  alpha_init: 0.2
  beta_init: 0.05
  gamma_init: 0.1
  learning_rate: 0.05

saft:
  stable_alpha: 0.15
  responsive_alpha: 0.6
  error_window: 5
  spike_threshold: 1.5

output:
  figures_dir: "images"
  figure_dpi: 150
