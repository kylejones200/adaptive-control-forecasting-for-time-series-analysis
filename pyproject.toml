[project]
name = "adaptive-control-forecasting-for-time-series-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Optional Rust extension — build with:
#   pip install maturin && maturin develop --release -m rust/adaptive-py/Cargo.toml
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/adaptive-py/Cargo.toml"
module-name = "adaptive_forecast_rs"
